<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contacto</title>
</head>
<body>
  <h1>Formulario de contacto</h1>

  <p>
    <a href="index.html">Inicio</a> |
    <a href="contacto.html">Formulario</a> |
    <a href="horario.html">Horario</a>
  </p>
  <hr>

  <form action="datos.php" method="post">

    <fieldset>
      <legend>Datos personales</legend>

      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre">
      <br><br>

      <label for="apellidos">Apellidos:</label>
      <input type="text" id="apellidos" name="apellidos" placeholder="Escribe tus apellidos">
      <br><br>

      <label for="edad">Edad:</label>
      <input type="number" id="edad" name="edad" value="18">
      <br><br>

      <label for="ciudad">Ciudad:</label>
      <select id="ciudad" name="ciudad">
        <option value="almeria">Almería</option>
        <option value="cadiz">Cádiz</option>
        <option value="cordoba">Córdoba</option>
        <option value="granada">Granada</option>
        <option value="huelva">Huelva</option>
        <option value="jaen">Jaén</option>
        <option value="malaga">Málaga</option>
        <option value="sevilla">Sevilla</option>
      </select>
    </fieldset>

    <fieldset>
      <legend>Datos de acceso</legend>

      <label for="correo">Correo electrónico:</label>
      <input type="email" id="correo" name="correo" placeholder="Escribe tu correo">
      <br><br>

      <label for="clave">Contraseña:</label>
      <input type="password" id="clave" name="clave" placeholder="Escribe tu contraseña">
    </fieldset>

    <fieldset>
      <legend>Aficiones</legend>

      <input type="checkbox" id="videojuegos" name="aficiones[]" value="videojuegos" checked>
      <label for="videojuegos">Videojuegos</label>

      <input type="checkbox" id="musica" name="aficiones[]" value="musica">
      <label for="musica">Música</label>

      <input type="checkbox" id="deporte" name="aficiones[]" value="deporte">
      <label for="deporte">Deporte</label>

      <input type="checkbox" id="cine" name="aficiones[]" value="cine">
      <label for="cine">Cine</label>

      <input type="checkbox" id="lectura" name="aficiones[]" value="lectura">
      <label for="lectura">Lectura</label>
    </fieldset>

    <fieldset>
      <legend>Mensaje</legend>

      <label for="mensaje">Escribe tu mensaje:</label>
      <br>
      <textarea id="mensaje" name="mensaje" rows="5" cols="40" placeholder="Escribe aqui tu mensaje"></textarea>
    </fieldset>

    <br>
    <input type="submit" value="Enviar">
    <input type="reset" value="Borrar">
  </form>
</body>
</html>
